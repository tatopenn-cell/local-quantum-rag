[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-quantum-rag"
version = "0.2.0"
description = "A small, local, hybrid RAG tool for grounding technical conversations in your own PDFs and notes"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Salvatore Pennacchio" }]
requires-python = ">=3.9"
dependencies = [
    "PyMuPDF>=1.24",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-include-markdown-plugin>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/tatopenn-cell/local-quantum-rag"
Repository = "https://github.com/tatopenn-cell/local-quantum-rag"

[project.scripts]
local-quantum-rag-build = "build_index:main"
local-quantum-rag-query = "query:main"

[tool.setuptools]
py-modules = ["build_index", "query"]
