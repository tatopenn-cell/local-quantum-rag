site_name: local-quantum-rag
site_description: A small, local, hybrid RAG tool for grounding technical conversations in your own PDFs and notes.
site_url: https://tatopenn-cell.github.io/local-quantum-rag/
repo_url: https://github.com/tatopenn-cell/local-quantum-rag
repo_name: tatopenn-cell/local-quantum-rag
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github
    logo: material/atom

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - toc:
      permalink: true

plugins:
  - search
  - include-markdown

nav:
  - Home: index.md
  - Draft and Verification methodology: draft_verification_methodology.md
  - Four-Phase Methodology: four_phase_methodology.md
  - "Workflows 3-4: Discovery & Evolving Software repos": verification_layers.md
  - Operational constraints: operational_constraints.md
  - Case study — the Reload Gap: context_engineering_case_study.md
  - Changelog: changelog.md
  - Contributing: contributing.md
  - License: LICENSE.md
